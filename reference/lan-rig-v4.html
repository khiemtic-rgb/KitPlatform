<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lan v4 – dùng chính tranh gốc</title>
<style>
:root{--bg:#f4f1ea;--fg:#2b2622;--card:#fff;--bd:#d8d2c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b19;--fg:#ece7de;--card:#2a2723;--bd:#46413a}}
:root[data-theme="dark"]{--bg:#1d1b19;--fg:#ece7de;--card:#2a2723;--bd:#46413a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.w{max-width:960px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
p.s{margin:0 0 12px;opacity:.75;font-size:14px}
canvas{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--bd)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
input[type=range]{flex:1;min-width:140px}
#out{margin-top:10px;font-size:14px}
#out video{width:100%;border-radius:10px;margin-top:6px}
</style>
</head>
<body>
<div class="w">
<h1>Lan v4 – dùng chính tranh gốc</h1>
<p class="s">Cắt từ tranh gốc của bạn: đầu, thân, tay trên, cẳng tay, bàn tay, chân là các mảnh ảnh thật. Chỗ thân bị tay che được điền bằng chính vải áo, nên giơ tay không hở nách.</p>
<canvas id="cv" width="1280" height="720"></canvas>
<div class="bar">
<button id="pp">Tạm dừng</button>
<button id="rs">Phát lại</button>
<input id="sl" type="range" min="0" max="15" step="0.01" value="0">
<span id="tm">0.0 / 15 s</span>
<button id="rc">Ghi video (.webm)</button>
</div>
<div id="out"></div>
</div>
<script>
const cv=document.getElementById('cv'),c=cv.getContext('2d');
const D=Math.PI/180,T=15,GY=620,S=.5;
const C={skin:'#f1c4a3',skinD:'#e0a984',hair:'#7a4a2b',hairD:'#5e3519',torso:'#233f7d',sleeve:'#1d3670',cuff:'#16295c',pants:'#5a6a37',pantsD:'#46542a',shoe:'#1e2f66'};
// Kịch bản dạng dữ liệu: [t, Lvai, Lkhuỷu, vẫy, Rvai, Rkhuỷu, x, nghiêng đầu]
const K=[
[0,7,8,0,7,8,360,0],[1.5,7,8,0,7,8,360,0],
[2.6,7,8,0,67,0,360,-.03],[4.6,7,8,0,67,0,360,-.03],[5.6,7,8,0,7,8,360,0],
[6.4,115,55,0,7,8,360,.05],[7,115,55,1,7,8,360,.05],[9,115,55,1,7,8,360,.05],[9.8,7,8,0,7,8,360,0],
[10,7,8,0,7,8,360,0],[11.6,7,8,0,7,8,600,0],
[12.4,7,8,0,42,3,600,.04],[13.8,7,8,0,42,3,600,.04],[14.6,7,8,0,7,8,600,0],[15,7,8,0,7,8,600,0]
];
const SUB=[[2.6,4.8,'Nhìn kìa, cái lọ trên quầy!'],[6.6,9,'Chào bạn!'],[12.4,14.4,'Mình với tới rồi.']];
const POINT=[2.8,4.6];
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function pose(t){
  t=Math.min(Math.max(t,0),T);
  let i=0;while(i<K.length-2&&t>=K[i+1][0])i++;
  const a=K[i],b=K[i+1],u=ease(Math.min(1,Math.max(0,(t-a[0])/(b[0]-a[0]||1))));
  const L=k=>a[k]+(b[k]-a[k])*u;
  return{Lsh:L(1),Lel:L(2),wave:L(3),Rsh:L(4),Rel:L(5),x:L(6),tilt:L(7)};
}
function seg(x,y,r,w,l,col,rad){c.save();c.translate(x,y);c.rotate(r);c.fillStyle=col;c.beginPath();c.roundRect(-w/2,0,w,l,rad);c.fill();c.restore();}
function dot(x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill();}
function ell(x,y,rx,ry,col,rot){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,7);c.fill();}
// d=-1: tay bên trái màn hình, d=1: bên phải. 0 độ = buông xuống, 90 = ngang ra ngoài, 180 = thẳng lên
function arm(d,sx,sy,sh,el,finger){
  const U=150,F=135,a=sh*D,b=(sh+el)*D,rA=-d*a,rB=-d*b;
  const ex=sx+d*Math.sin(a)*U,ey=sy+Math.cos(a)*U;
  const wx=ex+d*Math.sin(b)*F,wy=ey+Math.cos(b)*F;
  c.save();c.translate(wx,wy);c.rotate(rB);              // bàn tay (da)
  ell(0,36,16,40,C.skin);ell(-d*13,22,6,16,C.skin,-d*.25);
  if(finger)seg(0,40,0,8,38,C.skin,4);
  c.restore();
  seg(ex,ey,rB,44,F,C.sleeve,18);                         // cẳng tay (tay áo)
  c.save();c.translate(wx,wy);c.rotate(rB);c.fillStyle=C.cuff;c.beginPath();c.roundRect(-24,-20,48,22,6);c.fill();c.restore(); // măng sét
  seg(sx,sy,rA,52,U,C.sleeve,22);                         // cánh tay trên
  dot(ex,ey,24,C.sleeve);                                 // MẢNH CHE KHUỶU
  dot(sx,sy,28,C.sleeve);                                 // MẢNH CHE VAI
}
const ZK=[[0,1],[1.5,1.05],[5.5,1.05],[6.4,1.32],[9,1.32],[10,1],[11.6,1.05],[12.4,1.3],[14,1.3],[15,1]];
const YK=[[0,0],[2.2,0],[2.8,.6],[4.6,.6],[5.4,0],[10.4,0],[10.8,.5],[11.6,.5],[12.2,.8],[14,.8],[14.8,0],[15,0]];
function lerpK(A,t){t=Math.min(Math.max(t,0),T);let i=0;while(i<A.length-2&&t>=A[i+1][0])i++;const a=A[i],b=A[i+1];return a[1]+(b[1]-a[1])*ease(Math.min(1,Math.max(0,(t-a[0])/(b[0]-a[0]))));}
const yawAt=t=>lerpK(YK,t);
function layer(cx,f,fn){c.save();c.translate(-(cx-640)*f,0);fn();c.restore();}
function scene(t,cx){
  layer(cx,.1,()=>{const g=c.createLinearGradient(0,0,0,GY);g.addColorStop(0,'#f6dcc0');g.addColorStop(1,'#fbeed8');
    c.fillStyle=g;c.fillRect(-600,0,2500,GY);
    [[200,470,260,90],[640,490,340,110],[1100,470,280,95]].forEach(([x,y,rx,ry])=>ell(x,y,rx,ry,'#ecd0aa'));});
  layer(cx,.3,()=>{c.fillStyle='#bcd8e6';c.fillRect(90,110,180,160);c.strokeStyle='#8a6a4a';c.lineWidth=8;c.strokeRect(90,110,180,160);
    c.beginPath();c.moveTo(180,110);c.lineTo(180,270);c.moveTo(90,190);c.lineTo(270,190);c.lineWidth=5;c.stroke();
    c.fillStyle='#d9a06a';c.fillRect(920,150,120,90);c.fillStyle='#f3e2c3';c.fillRect(930,160,100,70);});
  layer(cx,1,()=>{c.fillStyle='#c98f5a';c.fillRect(-600,GY,2500,100);
    c.strokeStyle='rgba(90,55,30,.35)';c.lineWidth=2;
    for(let x=-600;x<1900;x+=130){c.beginPath();c.moveTo(x,GY);c.lineTo(x+(x-640)*.4,720);c.stroke();}});
  layer(cx,.6,()=>{c.fillStyle='rgba(255,236,170,'+(.13+.05*Math.sin(t*.6))+')';
    c.beginPath();c.moveTo(90,270);c.lineTo(270,270);c.lineTo(560+Math.sin(t*.4)*40,GY+90);c.lineTo(250+Math.sin(t*.4)*40,GY+90);c.fill();});
  layer(cx,1,()=>{c.fillStyle='#8b5e3c';c.fillRect(700,385,450,GY-385);c.fillStyle='#a8764d';c.fillRect(690,372,470,16);
    c.fillStyle='rgba(0,0,0,.18)';c.fillRect(700,GY-14,450,14);
    c.fillStyle='rgba(180,220,235,.85)';c.fillRect(750,345,36,28);c.fillStyle='#d1495b';c.fillRect(746,336,44,11);
    c.fillStyle='#e8a33d';c.fillRect(754,356,28,12);});
}

const PL=DATA.plates,PV=DATA.piv,IM={};let ready=0;
for(const k in PL){const i=new Image();i.onload=()=>ready++;i.src=PL[k].d;IM[k]=i;}
const NP=Object.keys(PL).length;
const pl=k=>c.drawImage(IM[k],PL[k].x,PL[k].y);
const rotAt=(r,x,y)=>{c.translate(x,y);c.rotate(r);c.translate(-x,-y);};
// tay cắt từ tranh gốc: cánh tay trên, cẳng tay, bàn tay là 3 mảnh; mảnh tròn vải thật che vai và khuỷu
function arm(s,d,du,de,wv){
  const S=[PV[s].S[0],284],E=PV[s].E,W=PV[s].W;
  c.save();rotAt(-d*du*D,S[0],S[1]);
  c.save();rotAt(-d*de*D,E[0],E[1]);
  c.save();rotAt(-d*wv,W[0],W[1]);pl('hd'+s);c.restore();pl('fo'+s);c.restore();
  pl('up'+s);pl('capE'+s);pl('capS'+s);c.restore();
}
function leg(k,hx,sw){c.save();rotAt(sw,hx,470);pl(k);c.restore();}
function lan(p,t){
  const sp=(pose(t+.05).x-pose(t-.05).x)/.1,walk=Math.min(1,Math.abs(sp)/100);
  const ph=t*8,bob=walk?-Math.abs(Math.sin(ph))*8:Math.sin(t*2.2)*-3,YAW=yawAt(t);
  c.save();c.translate(p.x,GY);c.scale(S,S);c.translate(-430,-1080);
  c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
  ell(430+Math.sin(t*.4)*40,1085,120+Math.sin(t*.4)*20,16,'rgba(0,0,0,.18)');
  c.translate(0,bob);
  const sw=Math.sin(ph)*.05*walk;
  leg('legL',380,sw);leg('legR',480,-sw);pl('torso');
  c.save();rotAt(p.tilt,430,215);c.translate(YAW*5,0);c.translate(430,0);c.scale(1-.02*Math.abs(YAW),1);c.translate(-430,0);pl('head');
  if((t%3.2)<.12){[[397,148],[451,147]].forEach(([x,y])=>{ell(x,y,14,9,DATA.skin);c.strokeStyle='#3a2314';c.lineWidth=3;c.beginPath();c.arc(x,y-3,10,.15,Math.PI-.15);c.stroke();});}
  if(SUB.some(s=>t>s[0]&&t<s[1])){const o=Math.abs(Math.sin(t*14));ell(430,184,8,2+4*o,'#6b2a25');}
  c.restore();
  const o=(d,x,y)=>Math.atan2(d*x,y)/D,wv=p.wave*Math.sin(t*13);
  const L0=o(-1,PV.L.E[0]-PV.L.S[0],PV.L.E[1]-284),R0=o(1,PV.R.E[0]-PV.R.S[0],PV.R.E[1]-284);
  arm('L',-1,p.Lsh-7,p.Lel-8+wv*24,wv*.18);
  arm('R',1,p.Rsh-7,p.Rel-8,0);
  c.restore();
}
function render(t){if(ready<NP){c.fillStyle='#f4efe6';c.fillRect(0,0,1280,720);return;}
  const p=pose(t),z=lerpK(ZK,t),cx=640+(p.x-480)*.5+Math.sin(t*.7)*6;
  c.save();c.translate(640,420);c.scale(z);c.translate(-640,-420);
  scene(t,cx);
  c.save();c.translate(-(cx-640),0);lan(p,t);c.restore();
  c.restore();
  const v=c.createRadialGradient(640,360,260,640,360,780);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(40,20,0,.28)');
  c.fillStyle=v;c.fillRect(0,0,1280,720);
  const s=SUB.find(s=>t>s[0]&&t<s[1]);
  if(s){c.font='600 30px system-ui,sans-serif';c.textAlign='center';
    const w=c.measureText(s[2]).width+48;
    c.fillStyle='rgba(20,18,16,.72)';c.beginPath();c.roundRect(640-w/2,650,w,50,12);c.fill();
    c.fillStyle='#fff';c.fillText(s[2],640,685);}
}
let tt=0,playing=true,last=performance.now(),recorder=null;
const pp=document.getElementById('pp'),sl=document.getElementById('sl'),tm=document.getElementById('tm'),out=document.getElementById('out');
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing){tt+=dt;if(tt>=T){if(recorder){recorder.stop();recorder=null;playing=false;pp.textContent='Phát';tt=T;}else tt=0;}}
  render(tt);sl.value=tt;tm.textContent=tt.toFixed(1)+' / 15 s';
  requestAnimationFrame(frame);
}
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Tạm dừng':'Phát';};
document.getElementById('rs').onclick=()=>{tt=0;playing=true;pp.textContent='Tạm dừng';};
sl.oninput=()=>{tt=+sl.value;playing=false;pp.textContent='Phát';};
document.getElementById('rc').onclick=()=>{
  try{
    const mime=['video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
    const r=new MediaRecorder(cv.captureStream(30),{mimeType:mime}),ch=[];
    r.ondataavailable=e=>e.data.size&&ch.push(e.data);
    r.onstop=()=>{const u=URL.createObjectURL(new Blob(ch,{type:'video/webm'}));
      out.innerHTML='Đã ghi xong. <a href="'+u+'" download="lan.webm">Tải video</a> (nếu nút tải không chạy, nhấp phải vào video rồi Lưu)<video controls src="'+u+'"></video>';};
    out.textContent='Đang ghi 15 giây...';tt=0;playing=true;pp.textContent='Tạm dừng';recorder=r;r.start();
  }catch(e){out.textContent='Trình duyệt này không hỗ trợ ghi video.';}
};
requestAnimationFrame(frame);
</script>
