<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trading Research</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Trading Research V1</p>
      <h1>Research desk</h1>
    </div>
    <div class="header-meta">
      <span id="source">Đang tải</span>
      <time id="generated"></time>
      <button id="refresh" type="button">Tải lại</button>
    </div>
  </header>
  <nav>
    <button type="button" data-view="overview" class="active">Overview</button>
    <button type="button" data-view="market">Market Data</button>
    <button type="button" data-view="signals">Signals &amp; Risk</button>
    <button type="button" data-view="trades">Paper Trades</button>
    <button type="button" data-view="runs">Run History</button>
  </nav>
  <main id="main"><p class="state">Đang tải dữ liệu research.</p></main>
  <script src="/app.js"></script>
</body>
</html>
