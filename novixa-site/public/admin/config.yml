# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Novixa CMS — nhân viên đăng tin tại https://novixa.vn/admin/

locale: vi

backend:
  name: github
  repo: khiemtic-rgb/KitPlatform
  branch: main
  # Đăng nhập bằng GitHub Access Token (không cần OAuth app).
  # Khi đã gắn GITHUB_CLIENT_ID/SECRET trên Cloudflare, đổi thành:
  #   base_url: https://novixa.vn
  #   auth_methods: [oauth, token]
  auth_methods: [token]
  commit_messages:
    create: 'cms: thêm {{collection}} "{{slug}}"'
    update: 'cms: cập nhật {{collection}} "{{slug}}"'
    delete: 'cms: xóa {{collection}} "{{slug}}"'
    uploadMedia: 'cms: tải ảnh "{{path}}"'
    deleteMedia: 'cms: xóa ảnh "{{path}}"'

# Ảnh bài tin → public/images/tin-tuc/{slug}.png
media_folder: novixa-site/public/images/tin-tuc
public_folder: /images/tin-tuc

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: tin_tuc
    label: Kiến thức nhà thuốc
    label_singular: Bài viết
    description: >
      Chọn Nhóm cha (hiện trên menu novixa.vn). Nếu Nhóm cha = Quản trị nhà thuốc
      thì chọn thêm Nhóm bài viết (8 mục con — chỉ dùng trong CMS, web vẫn hiện mục cha).
    folder: novixa-site/src/content/tin-tuc
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} — {{category}} — {{subcategory}} — {{pubDate}}'
    sortable_fields:
      fields: [pubDate, title, category, subcategory]
      default:
        field: pubDate
        direction: descending
    view_groups:
      - label: Theo nhóm cha
        field: category
      - label: Theo nhóm bài viết (Quản trị)
        field: subcategory
    fields:
      - label: Tiêu đề
        name: title
        widget: string
        hint: Hiện trên trang tin và Google.
      - label: Mô tả ngắn
        name: description
        widget: text
        required: false
        hint: Bỏ trống → web tự cắt ~160 ký tự đầu của nội dung. Điền nếu muốn tóm tắt riêng.
      - label: Nhóm cha
        name: category
        widget: select
        required: true
        default: quan-tri-nha-thuoc
        options:
          - { label: Quản trị nhà thuốc (Management), value: quan-tri-nha-thuoc }
          - { label: Vận hành nhà thuốc, value: van-hanh }
          - { label: Novixa Academy, value: novixa-academy }
          - { label: Bán hàng & Chăm sóc khách hàng, value: ban-hang-cskh }
          - { label: AI trong nhà thuốc, value: ai-trong-nha-thuoc }
          - { label: Chăm sóc khách hàng (Connect), value: connect }
          - { label: Câu chuyện khách hàng, value: cau-chuyen-khach-hang }
          - { label: Tin tức Novixa (menu Về Novixa), value: tin-tuc-novixa }
        hint: Nhóm hiện trên menu novixa.vn. Tin tức Novixa nằm dưới menu Về Novixa.
      - label: Nhóm bài viết (thuộc nhóm cha Quản trị)
        name: subcategory
        widget: select
        required: false
        options:
          - { label: Chiến lược phát triển, value: chien-luoc-phat-trien }
          - { label: KPI, value: kpi }
          - { label: Doanh thu, value: doanh-thu }
          - { label: Lợi nhuận, value: loi-nhuan }
          - { label: Dòng tiền, value: dong-tien }
          - { label: Nhân sự, value: nhan-su }
          - { label: Mở chuỗi, value: mo-chuoi }
          - { label: Chuyển đổi số, value: chuyen-doi-so }
        hint: >
          Chỉ chọn khi Nhóm cha = Quản trị nhà thuốc (Management).
          Dùng để sắp xếp trong CMS. Trên novixa.vn bài vẫn hiện chung trong mục cha.
      - label: Ảnh hiển thị
        name: image
        widget: image
        required: true
        choose_url: false
        hint: Ảnh thumbnail + đầu bài. Khuyến nghị 1200×630 px (PNG hoặc JPG).
      - label: Ngày đăng
        name: pubDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        hint: Bài có ngày sau hôm nay sẽ ẩn đến đúng ngày (giờ VN).
      - label: Ngôn ngữ
        name: lang
        widget: select
        options:
          - { label: Tiếng Việt, value: vi }
        default: vi
      - label: Nội dung
        name: body
        widget: markdown
        hint: Dùng heading ##, danh sách *, in đậm **text**.
