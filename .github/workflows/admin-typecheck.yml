name: Admin typecheck

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'client/admin/**'
      - '.github/workflows/admin-typecheck.yml'
  pull_request:
    paths:
      - 'client/admin/**'
      - '.github/workflows/admin-typecheck.yml'

jobs:
  tsc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
