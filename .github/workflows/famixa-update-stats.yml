# Cập nhật stats-snapshot.json cho trang /vi/thong-ke (Famixa).
name: Famixa update stats

on:
  workflow_dispatch:
  schedule:
    - cron: '25 */6 * * *'

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: famixa-site/package-lock.json

      - name: Kiểm tra Cloudflare secrets (Famixa)
        env:
          FAMIXA_CF_ANALYTICS_API_TOKEN: ${{ secrets.FAMIXA_CF_ANALYTICS_API_TOKEN }}
        run: |
          if [ -z "${{ secrets.FAMIXA_CF_ZONE_ID }}" ]; then
            echo "::error::Thiếu FAMIXA_CF_ZONE_ID (Zone ID famixa.vn)"
            exit 1
          fi
          if [ -z "$FAMIXA_CF_ANALYTICS_API_TOKEN" ]; then
            echo "::error::Thiếu FAMIXA_CF_ANALYTICS_API_TOKEN"
            echo "Tạo token Cloudflare: Zone famixa.vn → Analytics → Read"
            echo "Thêm GitHub Secret FAMIXA_CF_ANALYTICS_API_TOKEN (không dùng CF_ANALYTICS_API_TOKEN của Novixa)"
            exit 1
          fi

      - name: Fetch Cloudflare analytics
        working-directory: famixa-site
        env:
          FAMIXA_CF_ZONE_ID: ${{ secrets.FAMIXA_CF_ZONE_ID }}
          FAMIXA_CF_ANALYTICS_API_TOKEN: ${{ secrets.FAMIXA_CF_ANALYTICS_API_TOKEN }}
        run: |
          npm ci
          npm run fetch:stats-snapshot

      - name: Commit stats snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(famixa): update stats snapshot'
          file_pattern: famixa-site/public/stats-snapshot.json

      - name: Trigger Cloudflare deploy
        env:
          FAMIXA_CF_DEPLOY_HOOK: ${{ secrets.FAMIXA_CF_DEPLOY_HOOK }}
        run: |
          if [ -n "$FAMIXA_CF_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$FAMIXA_CF_DEPLOY_HOOK"
            echo "Đã gọi FAMIXA_CF_DEPLOY_HOOK."
          else
            echo "FAMIXA_CF_DEPLOY_HOOK chưa set — push commit snapshot sẽ trigger Pages nếu có Git integration."
          fi
