# Cloudflare Workers SSR: pharmacy white-label storefront (Host → API / pilot)
# Astro 7 @astrojs/cloudflare is Workers-only (not Pages Functions).
name: Pharmacy storefront Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/pharmacy-storefront/**'
      - '.github/workflows/pharmacy-storefront-pages.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/pharmacy-storefront/package-lock.json

      - name: Build pharmacy-storefront (Workers SSR)
        working-directory: client/pharmacy-storefront
        env:
          PUBLIC_API_BASE_URL: https://api.novixa.vn
          PUBLIC_STOREFRONT_TENANT: xuanhoa
        run: |
          npm ci
          npm run build

      - name: Deploy Worker (production)
        working-directory: client/pharmacy-storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-db0d4500b2d1fd3d607105da7d4f931d}"
          npx --yes wrangler@4 deploy --config dist/server/wrangler.json

      - name: Detach conflicting Pages custom domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-db0d4500b2d1fd3d607105da7d4f931d}"
          TOKEN="${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN}"
          PROJECT=pharmacy-storefront
          for domain in xuanhoa.novixa.vn demo-pharmacy.novixa.vn; do
            echo "=== detach Pages domain $domain (ignore if missing) ==="
            curl -sS -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT}/domains/${domain}" \
              -H "Authorization: Bearer ${TOKEN}" || true
            echo
          done

      - name: Attach Worker custom domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-db0d4500b2d1fd3d607105da7d4f931d}"
          TOKEN="${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN}"
          SERVICE=pharmacy-storefront
          ZONE_ID=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=novixa.vn" \
            -H "Authorization: Bearer ${TOKEN}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or [{}])[0].get("id",""))')
          echo "zone=$ZONE_ID"
          test -n "$ZONE_ID"
          for hostname in xuanhoa.novixa.vn demo-pharmacy.novixa.vn; do
            echo "=== worker domain $hostname ==="
            RESP=$(curl -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/domains" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"hostname\":\"${hostname}\",\"service\":\"${SERVICE}\",\"environment\":\"production\",\"zone_id\":\"${ZONE_ID}\"}")
            echo "$RESP"
            echo "$RESP" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          if d.get("success"):
            print("ok", d.get("result",{}).get("hostname"))
            sys.exit(0)
          errs=d.get("errors") or []
          msg=json.dumps(errs).lower()
          if "already" in msg or any(e.get("code") in (100004, 100020) for e in errs):
            print("domain already attached (ok)")
            sys.exit(0)
          sys.exit(1)
          '
          done
