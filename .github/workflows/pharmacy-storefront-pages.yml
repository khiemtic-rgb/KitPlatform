# Cloudflare Workers SSR: pharmacy white-label storefront (Host → API / pilot)
# Astro 7 @astrojs/cloudflare is Workers-only (not Pages Functions).
name: Pharmacy storefront Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/pharmacy-storefront/**'
      - '.github/workflows/pharmacy-storefront-pages.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/pharmacy-storefront/package-lock.json

      - name: Build pharmacy-storefront (Workers SSR)
        working-directory: client/pharmacy-storefront
        env:
          PUBLIC_API_BASE_URL: https://api.novixa.vn
          PUBLIC_STOREFRONT_TENANT: xuanhoa
        run: |
          npm ci
          npm run build

      - name: Deploy Worker with zone routes
        working-directory: client/pharmacy-storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-db0d4500b2d1fd3d607105da7d4f931d}"
          # Ensure user wrangler routes merge into generated worker config
          npx --yes wrangler@4 deploy --config dist/server/wrangler.json

      - name: Ensure Pages domains exist as DNS origin fallback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-db0d4500b2d1fd3d607105da7d4f931d}"
          TOKEN="${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN}"
          PROJECT=pharmacy-storefront
          API="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT}/domains"
          for domain in xuanhoa.novixa.vn demo-pharmacy.novixa.vn; do
            echo "=== Pages domain $domain ==="
            RESP=$(curl -sS -X POST "$API" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${domain}\"}")
            echo "$RESP"
            echo "$RESP" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          if d.get("success"):
            print("added", d["result"].get("name"))
            sys.exit(0)
          errs=d.get("errors") or []
          codes={e.get("code") for e in errs}
          msg=json.dumps(errs).lower()
          # already attached / already exists
          if codes & {8000014, 8000015, 8000032, 8000018} or "already" in msg:
            print("domain already attached (ok)")
            sys.exit(0)
          sys.exit(1)
          '
          done
